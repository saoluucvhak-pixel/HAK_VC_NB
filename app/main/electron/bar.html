<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root { --bg: #E7E3D9; --fg: #2B2A26; --accent: #1F6F5B; }
  html, body { margin: 0; height: 100%; background: var(--bg); font: 13px/1 system-ui, "Segoe UI", sans-serif; color: var(--fg); user-select: none; }
  #bar { display: flex; align-items: flex-end; height: 100%; padding: 0 10px; gap: 4px; box-sizing: border-box; border-bottom: 1px solid #C9C4B6; }
  button { all: unset; cursor: pointer; padding: 9px 16px; border-radius: 8px 8px 0 0; display: flex; flex-direction: column; gap: 3px; }
  button b { font-size: 13px; } button span { font-size: 10px; opacity: .65; }
  button:hover { background: #F1EFE9aa; }
  button[aria-selected="true"] { background: #F1EFE9; box-shadow: inset 0 -3px 0 var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
</head>
<body>
<div id="bar" role="tablist" aria-label="Phân hệ"></div>
<script>
  const bar = document.getElementById('bar');
  const render = (mods, active) => {
    bar.innerHTML = '';
    for (const m of mods) {
      const b = document.createElement('button');
      b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(m.id === active));
      const t = document.createElement('b'); t.textContent = m.title;
      const s = document.createElement('span'); s.textContent = m.subtitle;
      b.append(t, s); b.onclick = () => window.suite.switchTo(m.id); bar.appendChild(b);
    }
  };
  window.suite.onState(({ modules, active }) => render(modules, active));
  window.suite.ready();
</script>
</body>
</html>
